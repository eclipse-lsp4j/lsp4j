source.. = src/main/java/,\
           src/main/resources/,\
           src/main/xtend-gen/
output.. = target/classes/
bin.includes = META-INF/,\
               .

# The generator contains the Xtend active annotations that are processed when the
# Xtend sources are compiled, it is not needed at runtime
additional.bundles = org.eclipse.lsp4j.generator,\
                     org.eclipse.xtend.lib
