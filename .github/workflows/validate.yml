# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Validate

on:  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  push:
    branches-ignore:  # build all branches except:
    - 'dependabot/**'  # prevent workflow being triggered twice (once for commit to the branch and once for opening/syncing the PR)
    tags-ignore:  # don't build tags
    - '**'
    paths-ignore:
    - '**/*.md'
    - '.editorconfig'
    - '.git*'
  pull_request:
    paths-ignore:
    - '**/*.md'
    - '.editorconfig'
    - '.git*'

defaults:
  run:
    shell: bash


jobs:
  event_file:
    name: "Event File"
    runs-on: ubuntu-latest
    steps:
    - name: Upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: event-file
        path: ${{ github.event_path }}

  ###########################################################
  build:
  ###########################################################

    strategy:
      fail-fast: false
      matrix:
        os:  # https://github.com/actions/runner-images#available-images
        - ubuntu-latest
        - macos-15-intel # Intel
        - macos-latest # ARM
        - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:

    - name: Git Checkout
      uses: actions/checkout@v7  # https://github.com/actions/checkout

    - name: "Install: JDK 11 for testing"
      uses: actions/setup-java@v6  # https://github.com/actions/setup-java
      with:
        distribution: temurin
        java-version: 11

    - name: "Store: path of the JDK 11"
      run: echo "JDK11_HOME=$JAVA_HOME" >> $GITHUB_ENV

    - name: "Install: JDK 17 for testing"
      uses: actions/setup-java@v6  # https://github.com/actions/setup-java
      with:
        distribution: temurin
        java-version: 17

    - name: "Store: path of the JDK 17"
      run: echo "JDK17_HOME=$JAVA_HOME" >> $GITHUB_ENV

    - name: "Create Maven toolchains"
      # The tests are executed a second time on Java 11 and 17, see the test-older-javas profile
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/toolchains.xml <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <toolchains>
          <toolchain>
            <type>jdk</type>
            <provides>
              <id>JavaSE-11</id>
              <version>11</version>
            </provides>
            <configuration>
              <jdkHome>${JDK11_HOME}</jdkHome>
            </configuration>
          </toolchain>
          <toolchain>
            <type>jdk</type>
            <provides>
              <id>JavaSE-17</id>
              <version>17</version>
            </provides>
            <configuration>
              <jdkHome>${JDK17_HOME}</jdkHome>
            </configuration>
          </toolchain>
        </toolchains>
        EOF
        cat ~/.m2/toolchains.xml

    - name: "Install: JDK for building"
      uses: actions/setup-java@v6  # https://github.com/actions/setup-java
      with:
        distribution: temurin
        java-version: 21
        cache: maven

    - name: Build with Maven 🏗️
      run: ./mvnw --batch-mode clean install -Ptest-older-javas -Pjmh

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-results-${{ matrix.os }}
        if-no-files-found: warn
        path: |
          ${{ github.workspace }}/**/target/surefire-reports/**


    - name: Run API Compare
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: ./releng/runjapicmp.sh

    - name: Upload API Compare results
      if: ${{ matrix.os == 'ubuntu-latest' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: API Compare results
        if-no-files-found: warn
        path: |
          ${{ github.workspace }}/build/p2-repository/japicmp-report/
